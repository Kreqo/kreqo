# SEC-03's scan of every push: a branch or tag pushed without a pull request
# is scanned at once, not only when the next pull request runs. It runs on
# tags, so it keeps no build cache that a later run could trust, and it has
# no concurrency group, which would cancel a pending scan when a newer push
# arrives. Pushes that GitHub creates no run for are left to the daily scan
# of every ref. Hardened as CI-07, CI-08 and CI-09 ask; zizmor checks this
# file.
name: Secrets

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0" # A quicker build, without debug info.

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The scan covers the pushed ref's whole history.
          persist-credentials: false
      - name: Install the pinned toolchain (CI-16)
        run: rustup toolchain install
      - name: Read the pinned tool versions
        id: tools
        run: cargo xtask tools >> "$GITHUB_OUTPUT"
      - name: Install Betterleaks
        env:
          VERSION: ${{ steps.tools.outputs.betterleaks }}
          SHA256: ${{ steps.tools.outputs.betterleaks-sha256 }}
        run: |
          archive="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check
        run: cargo xtask check secrets
