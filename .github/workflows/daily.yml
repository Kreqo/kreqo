# SEC-02's daily cargo-deny scan of the default branch, so that an advisory
# published after a merge still turns up, and SEC-03's daily secret scan of
# every branch and tag. A scheduled run uses the default branch's workflow
# and ignores skip markers, so it covers the pushes that GitHub created no
# run for: commits marked [skip ci], more than three tags at once, or
# commits whose secrets.yml is missing or changed.
name: Daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0" # About half the build cache, without debug info.

jobs:
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (CI-16)
        shell: bash
        # The runner's own stable toolchain would otherwise enter the cache
        # key, so every runner image update would empty the cache.
        run: |
          rustup toolchain install
          rustup toolchain uninstall stable || true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks # Shared with CI's checks job, which builds the same.
      - name: Read the pinned tool versions
        id: tools
        run: cargo xtask tools >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ steps.tools.outputs.cargo-deny }}
          fallback: none # Only installs that the pinned manifests verify.
      - name: Check
        run: cargo xtask check deny

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Every branch and tag, with its whole history.
          persist-credentials: false
      - name: Install the pinned toolchain (CI-16)
        shell: bash
        # The runner's own stable toolchain would otherwise enter the cache
        # key, so every runner image update would empty the cache.
        run: |
          rustup toolchain install
          rustup toolchain uninstall stable || true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks # Shared with CI's checks job, which builds the same.
      - name: Read the pinned tool versions
        id: tools
        run: cargo xtask tools >> "$GITHUB_OUTPUT"
      - name: Install Betterleaks
        env:
          VERSION: ${{ steps.tools.outputs.betterleaks }}
          SHA256: ${{ steps.tools.outputs.betterleaks-sha256 }}
        run: |
          archive="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan every branch and tag
        run: cargo xtask scan-all-refs
