# SEC-03's scan of a pull request's title and description, which become
# the squash commit's message when it merges (CI-13), where a secret would
# stay for good (CI-01). It runs again on every edit, and its
# `description` job is a required check beside `ci`. A message edited in
# the merge dialog isn't scanned. Hardened as CI-07, CI-08 and CI-09 ask;
# zizmor checks this file.
name: Description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0" # A smaller build cache, without debug info.

jobs:
  description:
    name: description
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (CI-16)
        shell: bash
        # The runner's own stable toolchain would otherwise enter the cache
        # key, so every runner image update would empty the cache.
        run: |
          rustup toolchain install
          rustup toolchain uninstall stable || true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks # The checks job's build, which includes xtask.
          save-if: false # The checks job saves it.
      - name: Read the pinned tool versions
        id: tools
        run: cargo xtask tools >> "$GITHUB_OUTPUT"
      - name: Install Betterleaks
        env:
          VERSION: ${{ steps.tools.outputs.betterleaks }}
          SHA256: ${{ steps.tools.outputs.betterleaks-sha256 }}
        run: |
          archive="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the title and description
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: cargo xtask scan-pull-request
