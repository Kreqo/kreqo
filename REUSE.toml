# Licensing for files that can't carry a header (LEGAL-02), under LEGAL-08's
# defaults. Every other file carries its own SPDX header.
version = 1

# Generated by cargo, which drops added comments.
[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "Kreqo contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated from the rules, which are CC BY 4.0, by a generator that doesn't
# write headers yet (M2 ports it).
[[annotations]]
path = "conventions/views/**"
SPDX-FileCopyrightText = "Kreqo contributors"
SPDX-License-Identifier = "CC-BY-4.0"
