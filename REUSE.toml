# SPDX-FileCopyrightText: Kreqo contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

# Licensing for files that can't carry a header (LEGAL-02), under LEGAL-08's
# defaults. Every other file carries its own SPDX header.
version = 1

# Generated by cargo, which drops added comments.
[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "Kreqo contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated from the rules, which are CC BY 4.0, by `cargo xtask rules
# generate`, which writes no headers into them yet: M3 settles that with its
# other changes to the views.
[[annotations]]
path = "conventions/views/**"
SPDX-FileCopyrightText = "Kreqo contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The golden views of xtask's test data, which is MIT OR Apache-2.0: what
# the rules engine writes from it, first written by its prototype for M2,
# to pin what the views print (QA-09).
[[annotations]]
path = "xtask/testdata/rules/views/**"
SPDX-FileCopyrightText = "Kreqo contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
