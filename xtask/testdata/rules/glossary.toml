# Test data for the rules engine's golden views (QA-09): NOW.md lists only
# the terms it uses, "Team" only once the team's rules apply, and
# "Changelog", which only an option mentions, only while the option does.

[[term]]
term = "Changelog"
definition = "the record of what each release changes."

[[term]]
term = "Sign-off"
definition = "the founder's approval, which no view here mentions."

[[term]]
term = "Team"
definition = "two maintainers or more."

[[term]]
term = "The forge"
definition = "the service that hosts the code."
