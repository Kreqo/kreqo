[[rule]]
id = "LIFE-08"
level = "MUST"
statement = "An experiment gathers evidence for specific ADRs, under a brief the founder approves before its folder is created in `experiments/`. Its `project.toml` records its questions, the ADRs they feed, its end date and any extension, the rule IDs its brief adopts and the commit its configuration comes from. Until it is archived, its crates sit in one or more workspaces of their own, apart from the root workspace, each with its own pinned toolchain and lockfile, and it carries its own lint, formatting and cargo-deny configuration, copied from the root's at that commit (QA-01), so changes to the root's toolchain, dependencies and configuration don't reach it. It takes no outside contributions. Of the rules for projects, it follows only LIFE-01, LIFE-09, QA-01, SEC-01, LEGAL-01, LEGAL-03, LEGAL-08, LEGAL-11 and CI-16, and those its brief adopts. Rules that apply across the repository reach it as they reach every folder, except that pull requests check it only when they change its folder, the scheduled advisory scan (SEC-02) opens an issue for it instead of failing, and the dependency-update bot (SEC-20) skips it."
rationale = "Every project rule would bury a short experiment, but licensing, disclosure and security mistakes can't be undone afterward, and a frozen setup keeps the evidence comparable from start to end."
verification = "CI: `project.toml` fields; folder under `experiments/`; until archived, its own workspaces, toolchains, lockfiles and lint, formatting and cargo-deny configuration; Review checklist: brief approved before the folder was created"
check = "CI"
trigger = "always"
who = "you"
moments = ["experiment"]
added = "0.1.0"
status = "active"
history = ["2026-10-27 first rule batch: added."]

[[rule]]
id = "LIFE-09"
level = "MUST"
statement = "An experiment lasts at most 12 weeks from its folder's first commit, or 16 if the founder extends it before its end date; two weeks before that date, a scheduled job opens an issue to wrap it up. Its evidence is committed to its folder by the end date, and the ADRs it feeds link the evidence at a fixed commit. After the end date and until it is archived, CI fails any pull request that changes the folder except the one that archives the experiment (LIFE-01). It publishes no release, crate or package, and its CI artifacts are unannounced and expire within 30 days. Its code enters a project only through new pull requests under that project's rules."
rationale = "Without an end date and a closed exit, an experiment becomes a product that skipped the rules."
verification = "CI: end date at most 12 weeks after the folder's first commit, or 16 with the founder's extension in its `project.toml`; the reminder issue; the end-date check on pull requests; `publish = false` on every crate; retention of 30 days or less on each artifact upload; Review checklist: evidence committed by the end date and linked at a fixed commit"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"
history = ["2026-10-27 first rule batch: added."]
