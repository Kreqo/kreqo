# Brand (BRAND): the rules of this area. Source of truth;
# the views are generated from these files by compile.py.

[[rule]]
id = "BRAND-01"
level = "MUST"
statement = "Each app has one registered accent hue (BRAND-05). Lightness and chroma are fixed suite-wide for each accent role (text, fill, focus ring) in each theme (light, dark, increased contrast). An ADR chooses one of: (a) the muted chroma every hue can share in sRGB; (b) fixed lightness with each hue at its own maximum chroma up to a cap; (c) accents defined in Display P3 with gamut mapping to sRGB as fallback. Starting points: L ≈ 0.50–0.55 for fills and text in the light theme and L ≈ 0.65–0.75 for accent text in the dark theme; yellows and oranges are reviewed visually. The AppStream light and dark brand colors (PLAT-11) are generated from these tokens."
rationale = "No single lightness passes 4.5:1 on both white and black, and contrast varies about 12% across hues."
verification = "CI: contrast test over tokens per hue, role and theme; accent ADR recorded"
check = "CI"
trigger = "always"
who = "you"
moments = ["setup"]
open = { question = "Accent colors: muted shared chroma, uneven chroma under a cap, or Display P3 with sRGB fallback", leaning = "" }
added = "0.1.0"
status = "active"
history = ["2026-10-26 second rule batch: statement rewritten; restated requirement removed."]

[[rule]]
id = "BRAND-02"
level = "MUST"
statement = "Each app's name, which it carries once stable (LIFE-01), is \"Kreqo\" followed by one plain, descriptive word, such as Kreqo Notes, under 15 characters in total. The word is chosen to read the same in English and French where possible; otherwise it is translated like any other string. \"Kreqo\" itself is never translated, and a transliteration of the app's name may be added. Before use, the word is checked against existing apps in the same category."
rationale = "One trademark covers every app, and Quebec requires descriptive words in a trademark to appear in French on products."
verification = "Review checklist: name form, length, French form and existing-app search"
check = "Review"
trigger = "always"
who = "you"
moments = ["new-app"]
added = "0.1.0"
status = "active"
history = ["2026-10-26 second rule batch: statement rewritten; received the transliteration permission from I18N-10, which now points here.", "2026-10-27 first rule batch: statement rewritten; an app carries its name once stable, as LIFE-01 has it."]

[[rule]]
id = "BRAND-03"
level = "MUST"
statement = "Every crate published to crates.io is named `kreqo-` followed by one plain word, such as `kreqo-sync`; crates that are never published are exempt. Names are reserved on crates.io as soon as there is code to publish."
rationale = "crates.io names are first-come, and the prefix marks every crate as part of the suite."
verification = "CI: crate-name check over every workspace's publishable crates"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"
history = ["2026-10-27 first rule batch: verification rewritten for the monorepo."]

[[rule]]
id = "BRAND-04"
level = "MUST"
statement = "Every app's logo is composed on the logo skeleton: a construction grid of three equal circles whose centers form an upward equilateral triangle, separated by 0.3 to 0.5 times their radius, the exact ratio set by ADR after design review. A logo places its main forms on the grid without having to show the circles, and its silhouette differs from every other app's. Each logo ships full-color, monochrome (symbolic) and dark variants, a distinct pre-release variant, and icons fitting each platform's container and grid; at 32 px and below it uses simplified filled forms. The Flathub presentation ADR (UX-03) decides whether the skeleton can produce GNOME- and KDE-style icons."
rationale = "Tinted, clear and symbolic icon modes strip color, so only distinct silhouettes tell apps apart at small sizes."
verification = "Review checklist: grid overlay; icon variants; every app icon side by side in monochrome at 24 px"
check = "Review"
trigger = "first-release"
who = "you"
moments = ["release"]
open = { question = "Logo design review: the skeleton's gap ratio, the organization's mark, GNOME- and KDE-style icons", leaning = "" }
added = "0.1.0"
status = "active"

[[rule]]
id = "BRAND-05"
level = "SHOULD"
statement = "App hues are registered with at least 30° spacing and kept clear of the error, warning and success hues; every new hue is reviewed visually, not only computed."
rationale = "Close hues blur apps together, and status hues carry a fixed meaning."
verification = "Review checklist: hue registry entry and visual review"
check = "Review"
trigger = "always"
who = "you"
moments = ["new-app"]
added = "0.1.0"
status = "active"
