# Governance and contribution (GOV): the rules of this area. Source of truth;
# the views are generated from these files by compile.py.

[[rule]]
id = "GOV-01"
level = "MUST"
statement = "Significant changes go through a public RFC from the template, in the organization's `rfcs` repository; the RFC number is its pull-request number. Lifecycle: draft; a final comment period of at least 10 days, opened with a proposed disposition; then accepted, rejected or postponed. The author may withdraw at any time, and accepted RFCs become implemented or superseded. An unresolved blocking concern stops the comment period. The decision and its rationale are posted on the RFC, which is never substantially edited afterwards; a later RFC supersedes it and both link each other. Internal, reversible decisions use the light tier: a proposal issue seconded by a maintainer other than the author and left open 7 days, which a blocking concern turns into an RFC. The template requires a stated user problem with a real use case, alternatives including doing nothing and a plugin, how users learn it, an impact section (security, privacy, accessibility, internationalization, data and migration, performance, platforms), and implementation evidence before the comment period. Details: CONTRIBUTING.md."
rationale = "A timed public comment period and a written rationale protect the project while one person decides."
verification = "Review checklist: RFC link for significant changes; `rfcs` repository template"
check = "Review"
trigger = "open-to-contributions"
who = "you"
moments = ["contributors"]
added = "0.1.0"
status = "active"
history = ["2026-10-23 solo-first edit: waits for the trigger 'open-to-contributions' (was 'always')."]

[[rule]]
id = "GOV-02"
level = "MUST"
statement = "The author of a change owns its intent, specification, tests and consequences, and can explain what it does and why, whether or not AI wrote the code; for an agent's change, the author is the person who directed it. While there is one maintainer, changes to risk-tier paths get a line-level AI review and other changes the AI review, on top of the automated gates every change passes (CI-02). Each project lists its risk-tier paths in a machine-readable risk file that the review tooling enforces."
rationale = "Reading every line of AI-written code doesn't scale; owning intent and gating risk does."
verification = "Review checklist: author statement of intent; risk file enforced through the sign-off label (CI-03)"
check = "Review"
trigger = "always"
who = "you"
moments = ["risky-change"]
added = "0.1.0"
status = "active"
history = ["2026-10-23 solo-first edit: statement rewritten; verification rewritten; its original version returns at the trigger 'second-maintainer'.", "2026-10-26 second rule batch: statement and later version's statement rewritten; restated text removed, and the sign-off on intent moved to CI-03."]

[[rule.later]]
trigger = "second-maintainer"
statement = "The author of a change owns its intent, specification, tests and consequences, and can explain what it does and why, whether or not AI wrote the code. Changes to risk-tier paths get line-level human review and other changes intent-level review, on top of the automated gates every change passes (CI-02). Each project lists its risk-tier paths in a machine-readable risk file that the review tooling enforces; once CI-15 applies, that file is CODEOWNERS."
rationale = "Reading every line of AI-written code doesn't scale; owning intent and gating risk does."
verification = "Review checklist: author statement of intent; risk file enforced by required reviewers"
check = "Review"

[[rule]]
id = "GOV-03"
level = "MUST"
statement = "AI assistance is disclosed. Every commit in which AI produced anything beyond single-line completion carries the `Co-Authored-By:` trailer naming the model, as emitted by the tooling, and the squash commit keeps every such trailer from the branch. The pull request says how AI was used, what it produced, what the human verified, and the human creative input (design, selection, editing). Disclosure covers code, docs, RFCs, ADRs, issues and review comments."
rationale = "Disclosure tells reviewers where to look and records human authorship for the copyright record."
verification = "CI: squash commit carries the branch's trailers; Review checklist: disclosure block present"
check = "Review"
trigger = "always"
who = "ai"
added = "0.1.0"
status = "active"
history = ["2026-10-26 second rule batch: statement rewritten; glossary term replaces a rule ID."]

[[rule]]
id = "GOV-04"
level = "MUST"
statement = "Before contributing upstream, contributors check the upstream's AI policy in the conventions' dated table of upstream AI policies, re-verified at the time, and follow it. A named human opens every upstream issue and pull request, writes its text and answers its review; an agent never acts in another project on its own. Where AI assistance is banned, the contribution is written by hand. Disclosure uses the upstream's own format, never Kreqo's trailer where the upstream forbids it."
rationale = "Upstream policies differ and change, a Kreqo trailer is forbidden in several, and upstream maintainers talk to accountable people."
verification = "Review checklist: upstream policy checked and dated; a human opened and wrote each upstream issue and pull request"
check = "Review"
trigger = "always"
who = "you"
moments = ["upstream"]
added = "0.1.0"
status = "active"
history = ["2026-10-23 solo-first edit: statement rewritten; rationale rewritten; verification rewritten."]

