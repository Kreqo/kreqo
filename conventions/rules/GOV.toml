[[rule]]
id = "GOV-07"
level = "MUST"
statement = "GOVERNANCE.md states the decision model (GOV-09); who holds each decision right (RFC sign-off, releases, merges per area); who holds each sensitive access (forge admin, CI secrets, signing keys, registry ownership, DNS); how people join and leave each role; the escalation path (REV-04); and the module that owns the interface guidelines, tokens and component library. Names live only in GOVERNANCE.md; other documents link to it."
rationale = "Hand-copied names drift; one file keeps roles and access current."
verification = "CI: GOVERNANCE.md present with required sections"
check = "CI"
trigger = "always"
