[[rule]]
id = "GOV-13"
level = "MUST"
statement = "Issue templates per type, with blank issues disabled. Bug reports give version, platform, steps, expected and actual results, and the smallest sample data that reproduces the problem, one problem per report; feature ideas go to discussion or RFC. Triage uses documented statuses, severities and labels (area, kind, difficulty, impact, AI-assisted; `unsafe` changes get a qualified reviewer), ranks data loss and crashes highest, and keeps a list of reports that aren't bugs, each with a canned answer. Reports waiting on the reporter close after 14 days of silence. New issues get a first response within a documented time. Details: CONTRIBUTING.md."
rationale = "Structured reports and canned answers are what let one maintainer triage at all."
verification = "CI: issue templates present; Periodic audit of triage statuses"
check = "Review"
trigger = "first-release"
who = "ai"
added = "0.1.0"
status = "active"
history = ["2026-10-26 second rule batch: statement rewritten; wording no longer names one app."]

[[rule]]
id = "GOV-14"
level = "MUST"
statement = "Text that speaks for a person or for the project, such as replies in issues and reviews, chat, forum posts, announcements and RFCs, is written by its human author. AI may translate or proofread, with disclosure, and quoted tool output is marked as such. Unedited AI output is never posted as a person's words. User documentation drafted with AI ships only after human revision, with disclosure (GOV-03). Pull request and issue descriptions that an agent writes for its operator are records, disclosed as AI-written."
rationale = "People want to talk to people; records an agent keeps for its operator aren't conversation."
verification = "Review checklist: human-written replies, posts and announcements; disclosure on agent-written records and AI-drafted documentation"
check = "Review"
trigger = "always"
who = "you"
moments = ["speaking"]
added = "0.1.0"
status = "active"
history = ["2026-10-23 solo-first edit: statement rewritten; rationale rewritten; verification rewritten; its original version returns at the trigger 'open-to-contributions'.", "2026-10-26 second rule batch: later version's statement rewritten; glossary term replaces a rule ID."]

[[rule.later]]
trigger = "open-to-contributions"
statement = "Text written for people (issues, PR titles and descriptions, reviews, RFCs, chat) is written by its human author. AI may translate or proofread, with disclosure, and quoted tool output is marked as such. Unedited AI output is never posted to a person. User documentation drafted with AI ships only after human revision, with disclosure (GOV-03). Branch commit messages are outside this rule, because the squash commit that lands carries the human-written PR title and description."
rationale = "People want to talk to people; every peer studied restricts AI-written text to humans."
verification = "Review checklist: human-written title, description and replies; documentation disclosure"
