level = "MUST"
statement = "CODE_OF_CONDUCT.md names a private reporting address and at least two people who handle reports, one of them outside the founder (an external contact while the project has one maintainer). Reports are acknowledged within 24 hours where possible and within 3 days at most, and decided within 7 days or given a new timeline. Anyone involved or conflicted steps aside. Responses follow the Contributor Covenant 3.0 ladder, with a named appeal route, protection from retaliation and confidential records. An anonymized summary is published yearly from 1.0."
rationale = "The hard case is a report about the founder, which needs a second contact to be credible."
