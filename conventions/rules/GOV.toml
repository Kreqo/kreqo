[[rule]]
id = "GOV-08"
level = "MUST"
statement = "Contributions are accepted under the unmodified Developer Certificate of Origin 1.1, without a CLA. The human author signs off once, in the pull request, and the sign-off lands in the squash commit; an agent never adds a sign-off. Sign-offs use a known identity: a name the contributor is publicly known by, used consistently, with a working email. Anonymous contributions are not accepted. People with release, signing, publishing or escrow access (LIFE-02) are personally known to the founder or another maintainer."
rationale = "The DCO needs a reachable, consistent identity; a legal name can't be verified without collecting ID."
verification = "CI: sign-off check on the squash commit"
check = "CI"
trigger = "open-to-contributions"
who = "tool"
added = "0.1.0"
status = "active"
